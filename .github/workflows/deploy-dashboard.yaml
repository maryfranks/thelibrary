name: Deploy Grafana Dashboard

on:
  push:
    branches:
      - main
    paths:
      - 'monitoring/dashboards/game-telemetry.json'
  workflow_dispatch:

jobs:
  deploy-dashboard:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Deploy dashboard to Grafana
        env:
          GRAFANA_TOKEN: ${{ secrets.GRAFANA_SERVICE_ACCOUNT_TOKEN }}
        run: |
          RESPONSE=$(curl -s -w "\n%{http_code}" -X POST "https://stats.littlefuzzydinos.com/api/dashboards/db" \
            -H "Authorization: Bearer ${GRAFANA_TOKEN}" \
            -H "Content-Type: application/json" \
            -d @monitoring/dashboards/game-telemetry.json)

          HTTP_BODY=$(echo "$RESPONSE" | sed '$d')
          HTTP_STATUS=$(echo "$RESPONSE" | tail -n1)

          echo "Response Body: $HTTP_BODY"
          echo "HTTP Status: $HTTP_STATUS"

          if [ "$HTTP_STATUS" -ne 200 ]; then
            echo "Failed to deploy dashboard to Grafana (HTTP $HTTP_STATUS)"
            exit 1
          fi

